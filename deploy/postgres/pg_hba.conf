# Client authentication for the production stack (compose.yaml passes it as hba_file).
#
# The superuser connects only over the container's own socket as the OS user postgres (the init
# script, `docker compose exec -u postgres postgres psql`). The two PollenInfo roles need a password
# (SCRAM) and may only come from the networks the container is attached to — in the stack, only
# `db`, where the server is the one other member — or from inside the container.
#
# TYPE  DATABASE    USER                             ADDRESS   METHOD
local   all         postgres                                   peer
local   polleninfo  polleninfo_owner,polleninfo_app            scram-sha-256
host    polleninfo  polleninfo_owner,polleninfo_app  samenet   scram-sha-256
