# The JDK and Gradle setup every workflow shares (server.yml, android.yml), so
# the toolchain is pinned in one place.
name: Set up JDK and Gradle
description: JDK 21 (Temurin) and Gradle with dependency caching and wrapper validation.

runs:
  using: composite
  steps:
    - name: Set up JDK 21
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: temurin
        java-version: "21"

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        # The open-source GitHub Actions cache rather than the commercial default.
        cache-provider: basic
        # Refuse to run a gradle-wrapper.jar whose checksum Gradle has not published.
        validate-wrappers: true
