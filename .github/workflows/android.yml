# The app's pipeline: the Android gate on every pull request that touches app code, the iOS
# compile gate on every pull request that touches shared app code or shared build configuration,
# and on a push to main that changed the app, a signed release published as a GitHub prerelease.
#
# Triggered by every pull request into develop or main and every push to main, with no path filter,
# so its gates always report and can be required checks. The `changes` job asks
# .github/scripts/changed-components.sh (the one path -> component mapping, shared with
# server.yml) whether the app (android) and the shared code (ios) changed; a gate whose component did
# not change is skipped, which GitHub counts as passed. See deploy/README.md.
name: Android

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [main]

# Least privilege: every job reads the repository and nothing more unless it says otherwise.
permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      android: ${{ steps.detect.outputs.android }}
      ios: ${{ steps.detect.outputs.ios }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Pull request: everything since its base; push to main: everything since the previous tip.
      - name: Detect the changed components
        id: detect
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: .github/scripts/changed-components.sh "$BASE" HEAD

  android-gate:
    name: android-gate
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK and Gradle
        uses: ./.github/actions/setup-jvm

      # The release build stays unsigned here and uploads no R8 mapping (no network credentials).
      # Lint fails on any finding, warnings included, across :androidApp, :composeApp and :theme.
      - name: Test, check translations, lint and build debug and release
        run: >-
          ./gradlew
          :composeApp:testAndroidHostTest
          :composeApp:checkTranslations
          :androidApp:lintRelease
          :androidApp:assembleDebug
          :androidApp:assembleRelease
          -Ppolleninfo.uploadCrashlyticsMapping=false

      # Cleartext, local-network access and "crash reports off" belong to the debug build only.
      - name: Check that debug-only manifest entries stay out of the release
        run: |
          manifests=androidApp/build/intermediates/merged_manifest/*/process*MainManifest/AndroidManifest.xml
          status=0
          for pattern in 'usesCleartextTraffic\|ACCESS_LOCAL_NETWORK' 'firebase_crashlytics_collection_enabled'; do
            # shellcheck disable=SC2086 # the glob must expand
            matches="$(grep -l "$pattern" $manifests || true)"
            if [[ "$matches" != "androidApp/build/intermediates/merged_manifest/debug/processDebugMainManifest/AndroidManifest.xml" ]]; then
              echo "::error::'$pattern' must appear in the debug merged manifest only, found in: ${matches:-none}"
              status=1
            fi
          done
          exit "$status"

      # The console names the first finding; the full report (all findings, explanations) is here.
      - name: Upload the lint report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-report
          path: androidApp/build/reports/lint-results-release.*
          retention-days: 7
          if-no-files-found: ignore

  # Compiles the shared code and its tests for the iOS simulator, so JVM-only code in commonMain
  # fails the pull request. No Xcode project is involved (there is none yet); publishing to
  # TestFlight comes with the iOS feature.
  ios-compile:
    name: ios-compile
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK and Gradle
        uses: ./.github/actions/setup-jvm

      - name: Compile the shared code and its tests for the iOS simulator
        run: ./gradlew :composeApp:compileTestKotlinIosSimulatorArm64

  # A merged release that changed the app: a signed APK and app bundle, the R8 mapping uploaded to
  # Crashlytics, and a GitHub prerelease tagged android-v<versionName>-<versionCode> holding the APK,
  # the bundle and mapping.txt. The signing secrets live in the environment android-release, which
  # only main may use, so no pull request ever sees them. See deploy/README.md, "Android release
  # signing".
  release:
    name: Android release
    needs: [changes, android-gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: android-release
    # The only job that writes: it creates the tag and the release.
    permissions:
      contents: write
    steps:
      # Full history: the version code is the number of commits up to HEAD.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK and Gradle
        uses: ./.github/actions/setup-jvm

      - name: Write the keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          status=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::The secret $name of the environment android-release is missing or empty (deploy/README.md, \"Android release signing\")."
              status=1
            fi
          done
          [[ "$status" -eq 0 ]] || exit 1
          keystore="$RUNNER_TEMP/upload.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          echo "ANDROID_KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"

      # The mapping upload to Crashlytics is on (the default) and needs no extra credential.
      - name: Build the signed APK and app bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :androidApp:assembleRelease :androidApp:bundleRelease

      - name: Read the version
        id: version
        run: ./gradlew -q :androidApp:printVersion | grep -E '^version(Name|Code)=' >> "$GITHUB_OUTPUT"

      # AGP names the outputs androidApp-release.*; a signed APK has no "-unsigned" suffix, so a
      # build that was not signed fails here.
      - name: Name the release files
        env:
          FILE_PREFIX: polleninfo-${{ steps.version.outputs.versionName }}-${{ steps.version.outputs.versionCode }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          cp androidApp/build/outputs/apk/release/androidApp-release.apk "$RUNNER_TEMP/release/$FILE_PREFIX.apk"
          cp androidApp/build/outputs/bundle/release/androidApp-release.aab "$RUNNER_TEMP/release/$FILE_PREFIX.aab"
          cp androidApp/build/outputs/mapping/release/mapping.txt "$RUNNER_TEMP/release/mapping.txt"

      # A prerelease, so it is not mistaken for a store release.
      - name: Create the GitHub prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: android-v${{ steps.version.outputs.versionName }}-${{ steps.version.outputs.versionCode }}
        run: >-
          gh release create "$TAG"
          --repo "$GITHUB_REPOSITORY"
          --prerelease
          --generate-notes
          --target "$GITHUB_SHA"
          --title "$TAG"
          "$RUNNER_TEMP"/release/*

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
