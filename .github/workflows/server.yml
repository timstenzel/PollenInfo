# The server's pipeline: test, package, scan and — on main only — publish the container image.
#
# One workflow per shipped artifact: android.yml and ios.yml will sit next to this one with their
# own path filters, so a change to one target never runs another's pipeline. See deploy/README.md.
name: Server

on:
  push:
    branches: [main]
    paths:
      - server/**
      - gradle/**
      - build.gradle.kts
      - settings.gradle.kts
      - gradle.properties
      - gradlew
      - deploy/**
      - .github/actions/**
      - .github/workflows/server.yml
  pull_request:
    paths:
      - server/**
      - gradle/**
      - build.gradle.kts
      - settings.gradle.kts
      - gradle.properties
      - gradlew
      - deploy/**
      - .github/actions/**
      - .github/workflows/server.yml

# Least privilege: every job reads the repository and nothing more unless it says otherwise.
permissions:
  contents: read

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/timstenzel/polleninfo-server

jobs:
  test-and-scan:
    name: Test, build and scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK and Gradle
        uses: ./.github/actions/setup-jvm

      # The database tests start postgres through Testcontainers on the runner's Docker.
      - name: Test the server and build its distribution
        run: ./gradlew :server:test :server:installDist

      - name: Build the image
        run: docker build --tag "$IMAGE:$GITHUB_SHA" server

      - name: Scan the image for fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: "1"

      # Hand the scanned image itself to the publish job, so what is pushed is exactly what passed.
      - name: Export the image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save "$IMAGE:$GITHUB_SHA" | gzip > image.tar.gz

      - name: Upload the image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-image
          path: image.tar.gz
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish to GHCR
    needs: test-and-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - name: Download the image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: server-image

      - name: Load the image
        run: gunzip --stdout image.tar.gz | docker load

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Push the commit tag and latest
        run: |
          docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:latest"
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"
